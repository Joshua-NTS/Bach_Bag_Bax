<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" crossorigin href="./assets/index-BhYKHLTG.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // This file is Vite's development entry: it loads /src/main.tsx, which a
      // browser cannot execute on its own. A static host that is pointed at the
      // repository root instead of the built output therefore serves a blank
      // page. Say so, rather than showing nothing.
      //
      // The build rewrites the script tag above to the bundled file, so the
      // selector below stops matching and this never fires in production.
      addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          var isDevEntry = document.querySelector('script[src="/src/main.tsx"]');
          if (!root || root.childElementCount > 0 || !isDevEntry) return;
          root.innerHTML =
            '<div style="font:16px/1.6 system-ui,sans-serif;max-width:38rem;margin:15vh auto;padding:0 1.5rem;color:#e9ecf5">' +
            '<h1 style="font-size:1.25rem;margin:0 0 .75rem">This is the development entry point</h1>' +
            '<p style="margin:0 0 .75rem;color:#a3abbf">The built site lives in <code>dist/</code>. ' +
            'Your host is serving the repository root instead.</p>' +
            '<p style="margin:0;color:#a3abbf">Set <strong>build command</strong> to <code>npm run build</code> ' +
            'and <strong>build output directory</strong> to <code>dist</code>.</p></div>';
          document.body.style.background = '#0b0d12';
        }, 2000);
      });
    </script>
  </body>
</html>
