name: Publish to GitHub Pages

# Publishes the built site by force-pushing dist/ to the gh-pages branch, which
# GitHub serves directly. Deliberately not the "GitHub Actions" Pages source:
# that one needs the repository's Pages setting switched on by hand first, and
# it restricts deployments to the default branch. This route needs no settings
# at all — pushing a gh-pages branch to a public repository is enough.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Force-push dist/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tells Pages to serve the files as they are instead of running Jekyll.
          touch dist/.nojekyll
          cd dist
          git init --quiet --initial-branch=gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Publish ${GITHUB_SHA:0:7}"
          # A single commit each time, so the 8 MB engraver bundle is never
          # accumulated across builds.
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
